services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=shortener
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://shortener:secret@db:5432/shortener
    depends_on:
      - db

volumes:
  pgdata: